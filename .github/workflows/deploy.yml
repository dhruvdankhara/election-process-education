name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: promptwars-antigravity
  REGION: asia-south1
  SERVICE_NAME: election-process-education

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build & Push image
        run: |
          IMAGE="gcr.io/$PROJECT_ID/$SERVICE_NAME"
          docker build --progress=plain -t $IMAGE:${{ github.sha }} .
          docker push $IMAGE:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          IMAGE="gcr.io/$PROJECT_ID/$SERVICE_NAME"
          gcloud run deploy $SERVICE_NAME \
            --image $IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --min-instances 0 \
            --max-instances 1 \
            --cpu 1 \
            --memory 512Mi \
            --timeout 60 \
            --concurrency 80 \
            --cpu-throttling \
            --cpu-boost \
            --set-env-vars "GOOGLE_CLOUD_PROJECT_ID=${{ secrets.GOOGLE_CLOUD_PROJECT_ID }},AUTH_JWT_SECRET=${{ secrets.AUTH_JWT_SECRET }},AUTH_COOKIE_NAME=${{ secrets.AUTH_COOKIE_NAME }},GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }},GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }},GOOGLE_OAUTH_CALLBACK_URL=${{ secrets.GOOGLE_OAUTH_CALLBACK_URL }},ADMIN_EMAIL_ALLOWLIST=${{ secrets.ADMIN_EMAIL_ALLOWLIST }},GOOGLE_ANALYTICS_PROPERTY_ID=${{ secrets.GOOGLE_ANALYTICS_PROPERTY_ID }},GOOGLE_CLOUD_LOCATION=${{ secrets.GOOGLE_CLOUD_LOCATION }},GOOGLE_VERTEX_MODEL=${{ secrets.GOOGLE_VERTEX_MODEL }},GOOGLE_TTS_LANGUAGE_CODE=${{ secrets.GOOGLE_TTS_LANGUAGE_CODE }},GOOGLE_TTS_VOICE_NAME=${{ secrets.GOOGLE_TTS_VOICE_NAME }},GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }},NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}"
